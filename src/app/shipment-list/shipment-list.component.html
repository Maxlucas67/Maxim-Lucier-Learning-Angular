<div class="shipment-list">
  <div *ngFor="let shipment of shipments; let i = index">
    <app-shipment-list-item
      [shipment]="shipment"
      [index]="i">
    </app-shipment-list-item>

    <div class="action-buttons">
      <button [routerLink]="['/modify', shipment.id]">Edit</button>
      <button (click)="deleteShipment(shipment.id)">Delete</button>
    </div>
  </div>
</div>
