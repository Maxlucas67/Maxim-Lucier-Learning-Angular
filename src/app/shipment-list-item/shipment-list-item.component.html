<div class="shipment-item">
  <h2>Shipment for: {{ shipment.receiverName }}</h2>
  <p><strong>Sender:</strong> {{ shipment.senderName }}</p>
  <p><strong>Address:</strong> {{ shipment.address }}</p>
  <p><strong>Weight:</strong> {{ shipment.weight }} kg</p>
  <p *ngIf="shipment.isFragile">Fragile</p>
</div>
